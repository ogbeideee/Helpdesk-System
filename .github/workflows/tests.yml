# The test gate. The secret-scan workflow proves no credential leaked; this one
# proves the code still works. It runs the same suites a developer runs before
# pushing — the 45 server suites on a disposable PostgreSQL service, the client
# check scripts, and the production build — so a red run means exactly what it
# means locally.
#
# Postgres is a service container rather than the bundled Windows cluster
# (scripts/lib/testpg.js): TEST_DATABASE_URL is exported directly, and testdb.js
# does the rest — it drops/creates a per-suite database, applies the committed
# migration history with `prisma migrate deploy`, and refuses anything that
# looks like the application's database (Supabase hosts outright).
#
# The deployment workflow (fly-deploy.yml) still triggers on main/master only;
# CI never auto-deploys, it only gates.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server suites (45)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketing_test
        ports:
          - 5433:5432
        # Health gate: every suite starts by DROP/CREATE-ing its own database,
        # so Postgres must accept connections before the first suite runs.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ticketing_test
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Apply the committed migration history (proves it deploys)
        working-directory: server
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/ticketing_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/ticketing_test

      - name: Run every server suite
        working-directory: server
        run: npm test

  client:
    name: Client checks + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check scripts (view modules, responsive contract, previews)
        working-directory: client
        run: npm test

      - name: Production build
        working-directory: client
        run: npx vite build
