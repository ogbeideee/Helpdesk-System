# Secret scanning — the gate that must not be bypassed.
#
# The local pre-commit hook (scripts/install-hooks.js) catches a secret before
# it leaves your machine, but a hook can be skipped with --no-verify, missed by
# a new clone that never ran the installer, or bypassed by a force push. This
# workflow is the part that cannot be skipped: it runs on every push and every
# pull request, and a finding fails the check.
#
# Two scanners run deliberately:
#   1. gitleaks — the industry standard, broad and battle-tested.
#   2. scripts/secret-scan.js — the project's own zero-dependency scanner, so
#      the gate still means something if the gitleaks action is unavailable,
#      and so the rules that cover THIS codebase's mistakes are enforced.
name: Secret scan
on:
  push:
    branches: ['**']
  pull_request:
  # Re-run when a push lands on an open PR branch.
  workflow_run:
    workflows: ['Fly Deploy']

permissions:
  contents: read

jobs:
  scan:
    name: Scan for committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: a secret committed earlier and
          # moved in a later commit still has to be found.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The report is uploaded as an artefact. A leaked secret in CI logs
          # is still a leaked secret, so nothing is echoed to the console.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

      - name: project scanner (zero dependency)
        run: |
          echo "Scanning the full history with scripts/secret-scan.js"
          # Sweep commit by commit, oldest first, so a finding names the commit
          # that introduced it. --all covers the current tree as well.
          node scripts/secret-scan.js --all
          first=$(git rev-list --max-parents=0 HEAD | head -1)
          git rev-list --reverse "$first"..HEAD | while read -r sha; do
            if ! git diff-tree --no-commit-id --name-only -r "$sha" | grep -q .; then
              continue
            fi
            node scripts/secret-scan.js "$sha~1..$sha" || exit 1
          done

      - name: scanner self-test
        run: node server/scripts/test-secret-scan.js
